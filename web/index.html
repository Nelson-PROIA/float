<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-200">
  <div class="max-w-3xl mx-auto px-6 py-4 flex items-center gap-2">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white font-bold text-lg">F</div>
    <span class="text-xl font-semibold tracking-tight">Float</span>
    <span class="ml-2 text-[10px] font-medium uppercase tracking-wider text-emerald-600">v0.2</span>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8">

  <div class="bg-white rounded-2xl border border-slate-200 p-6 mb-6">
    <div class="text-sm text-slate-500 mb-1">Float balance</div>
    <div class="text-4xl font-semibold tracking-tight" id="balance">$1,847.30</div>
    <div class="text-sm text-slate-500 mt-1">Alex Moreau &middot; alex@float.app</div>

    <div class="mt-5 pt-5 border-t border-slate-100">
      <div class="flex justify-between text-sm mb-2">
        <span class="text-slate-600">Today's spending</span>
        <span class="font-medium text-slate-900" id="spentToday">$0.00 <span class="text-slate-400 font-normal">of $500 daily limit</span></span>
      </div>
      <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full bg-emerald-500 rounded-full transition-all duration-700" id="spentBar" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <button id="sendBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-4 rounded-2xl mb-6 transition-colors shadow-sm">
    Send money
  </button>

  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100">
      <h2 class="font-semibold">Activity</h2>
    </div>
    <ul id="activityList" class="divide-y divide-slate-100">
      <li class="px-6 py-8 text-center text-slate-400 text-sm">Loading...</li>
    </ul>
  </div>

</main>

<script src="./app.js" type="module"></script>
</body>
</html>
