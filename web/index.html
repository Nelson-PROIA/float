<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Float</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

<header class="bg-white border-b border-slate-200">
  <div class="max-w-3xl mx-auto px-6 py-4 flex items-center gap-2">
    <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white font-bold text-lg">F</div>
    <span class="text-xl font-semibold tracking-tight">Float</span>
    <span class="ml-2 text-[10px] font-medium uppercase tracking-wider text-slate-400">beta &middot; v0.1</span>
  </div>
</header>

<main class="max-w-3xl mx-auto px-6 py-8">

  <div class="bg-white rounded-2xl border border-slate-200 p-6 mb-6">
    <div class="text-sm text-slate-500 mb-1">Float balance</div>
    <div class="text-4xl font-semibold tracking-tight" id="balance">$1,847.30</div>
    <div class="text-sm text-slate-500 mt-1">Alex Moreau &middot; alex@float.app</div>
  </div>

  <div class="bg-white rounded-2xl border border-dashed border-slate-300 p-8 mb-6 text-center">
    <div class="text-slate-900 font-medium mb-1">Send money - coming soon</div>
    <div class="text-sm text-slate-500">Self-serve transfers launching this month.</div>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100">
      <h2 class="font-semibold">Activity</h2>
    </div>
    <ul id="activityList" class="divide-y divide-slate-100">
      <li class="px-6 py-8 text-center text-slate-400 text-sm">Loading...</li>
    </ul>
  </div>

</main>

<script src="./app.js" type="module"></script>
</body>
</html>
